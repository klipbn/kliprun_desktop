<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KlipRun desktop screenshot with synthetic terminal</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #282c33; }
    main { display: flex; height: 100%; }
    .board { flex: 1; min-width: 0; height: 100%; border: 0; }
    .resize-handle { width: 10px; flex-shrink: 0; display: grid; place-items: center; background: #282c33; }
    .resize-handle span { width: 2px; height: 34px; border-radius: 2px; background: #464b57; }
    .terminal { width: 460px; max-width: 40%; flex-shrink: 0; background: #282c34; color: #abb2bf; }
    .toolbar { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #2f343e; font-size: 11px; white-space: nowrap; }
    .terminal-icon { color: #74ade8; font-size: 15px; }
    .tab { position: relative; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 9px; border-radius: 5px; color: #ffffff; background: rgb(255 255 255 / 10%); }
    .tab:not(.selected) { color: #ffffff; background: rgb(255 255 255 / 3%); }
    .tab.selected::before { content: ''; position: absolute; top: 0; left: 5px; right: 5px; height: 2px; border-radius: 1px; background: #61afef; }
    .tab.pinned { width: 28px; height: 28px; justify-content: center; padding: 0; }
    .tab.pinned svg { width: 14px; height: 14px; }
    .tab.pinned .dot { position: absolute; right: 3px; bottom: 3px; width: 5px; height: 5px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #98c379; }
    .spacer { flex: 1; }
    .button { color: #a9afbc; font-size: 14px; padding: 0 2px; }
    .divider { height: 1px; background: #464b57; }
    .screen { padding: 15px 18px; font: 13px/1.65 SFMono-Regular, Menlo, Monaco, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .command { color: #dce0e5; }
    .path { color: #61afef; }
    .muted { color: #a9afbc; }
    .agent { color: #98c379; }
    .prompt { color: #74ade8; }
  </style>
</head>
<body>
  <main aria-label="KlipRun desktop demo">
    <section class="terminal" aria-label="Synthetic OpenCode terminal">
      <header class="toolbar">
        <span class="terminal-icon" aria-hidden="true">▣</span>
        <div class="tab pinned selected" title="OpenCode · atlas" aria-label="Pinned OpenCode · atlas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/></svg><span class="dot"></span></div>
        <div class="tab"><span class="dot"></span>Codex · aurora</div>
        <span class="spacer"></span>
        <span class="button" aria-hidden="true">＋</span>
        <span class="button" aria-hidden="true">▤</span>
        <span class="button" aria-hidden="true">⤢</span>
        <span class="button" aria-hidden="true">‹</span>
      </header>
      <div class="divider"></div>
      <div class="screen"><span class="command">$ pwd</span>
<span class="path">/Users/demo/Projects/atlas</span>
<span class="command">$ opencode</span>
<span class="muted">OpenCode · glm-5.3 · demo session</span>
<span class="muted">Working on: Implement search API</span>
<span class="prompt">›</span> Checking route handlers and request validation…
<span class="agent">•</span> Read <span class="path">src/routes/search.ts</span>
<span class="agent">•</span> Found a missing empty-query check; reviewing the response shape.</div>
    </section>
    <div class="resize-handle" aria-hidden="true"><span></span></div>
    <iframe class="board" src="/" title="Fictional Kanban board and session details"></iframe>
  </main>
</body>
</html>
