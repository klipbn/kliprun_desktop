<style>
:root{color-scheme:dark;--bg:#0d1117;--surface:#161b22;--raised:#21262d;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;min-height:28px;padding:4px 8px}
button,select{border:1px solid var(--border);background:transparent;border-radius:4px}
button:hover{background:var(--raised)}button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
svg{width:14px;height:14px;flex-shrink:0;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon{width:28px;display:inline-grid;place-items:center;padding:0}.muted{color:var(--muted)}
.app{height:calc(100dvh - 25px);display:flex;flex-direction:column;min-height:360px}
.titlebar{height:28px;background:var(--surface);display:flex;align-items:center;justify-content:center;position:relative;color:var(--muted);font-size:11px;flex-shrink:0}
.lights{position:absolute;left:12px;display:flex;gap:8px}.lights i{height:10px;width:10px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.header{display:flex;align-items:center;padding:7px 12px;gap:16px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.brand{font-size:16px;display:flex;align-items:center;gap:7px}.brand svg{color:var(--accent);width:19px;height:19px}
.header nav,.tools{display:flex;align-items:center;gap:5px}.header nav{margin-left:auto}
.header .active{color:var(--accent);border-color:#58a6ff66;background:#58a6ff16}
.utility{border-left:1px solid var(--border);margin-left:4px;padding-left:9px;display:flex;gap:5px}
.workspace{display:flex;flex:1;min-height:0;position:relative}
.sidebar{width:184px;background:#11161d;border-right:1px solid var(--border);padding:8px 6px;display:flex;flex-direction:column;flex-shrink:0;overflow:auto}
.side-link{border:0;display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;min-height:28px;margin-bottom:1px;color:#aab4c0}
.side-link.active{background:#58a6ff18;color:#c3dfff}
.count{margin-left:auto;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.side-label{display:flex;align-items:center;justify-content:space-between;padding:13px 8px 4px;color:var(--muted);font-size:11px;font-weight:500}
.side-label .icon{min-height:22px;height:22px;width:22px;border:0}
.side-link.drag-over{outline:1px solid var(--accent);background:#58a6ff22}
.project-dot{height:6px;width:6px;border-radius:2px;flex-shrink:0;margin:0 4px}
.side-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.content{flex:1;min-width:0;overflow:auto;display:flex;flex-direction:column}
h1{font-size:13px;font-weight:600;margin:0;white-space:nowrap;max-width:210px;overflow:hidden;text-overflow:ellipsis}p{color:var(--muted);line-height:1.5;margin:0}
.list-toolbar{display:flex;align-items:center;gap:18px;padding:8px 12px;border-bottom:1px solid var(--border);min-height:45px;flex-shrink:0}
.filters{display:flex;gap:6px;align-items:center;margin-left:auto;min-width:0}
.search{display:flex;align-items:center;gap:6px;padding:0 8px;height:28px;border:1px solid var(--border);border-radius:4px;background:var(--bg);width:220px;min-width:100px;color:var(--muted)}
.search input{background:none;border:0;width:100%;font-size:12px;height:100%;min-width:0}
.search:focus-within{outline:1px solid var(--accent)}.search input:focus-visible{outline:0}
.filters select{height:28px;padding:0 6px;font-size:11px;background:var(--bg);max-width:130px}
.view-control{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.batch{padding:5px 12px;border-bottom:1px solid #58a6ff40;background:#58a6ff0d;display:flex;align-items:center;gap:8px;min-height:37px;flex-shrink:0}
.batch strong{font-size:11px;font-weight:500;margin-right:6px}.batch button{font-size:11px;min-height:25px}.batch .icon{margin-left:auto}
#session-groups{padding:5px 0}.section{margin-bottom:7px}
.group-head{display:flex;align-items:center;gap:7px;color:#aab4c0;font-size:11px;padding:6px 12px;min-height:28px;background:#161b2266}
.group-head .count{margin-left:0;font-size:10px}.group-head svg{width:13px;height:13px}
.session-list{overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:3px 12px;min-height:36px;border-bottom:1px solid #30363d55}
.row:hover{background:#161b22}.row.selected{background:#58a6ff12}.row.dragging{opacity:.4}
.row input{accent-color:var(--accent);width:13px;height:13px;flex-shrink:0;margin:0 1px 0 0}
.row-main{border:0;padding:0;background:transparent!important;display:flex;align-items:center;gap:8px;flex:1;text-align:left;min-width:0;min-height:28px}
.agent{font-size:10px;font-family:ui-monospace,monospace;color:#aab4c0;display:grid;place-items:center;width:18px;height:18px;flex-shrink:0;border:1px solid var(--border);border-radius:3px}
.row-text{min-width:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:12px;align-items:center}
.session-title{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:400}
.meta{display:grid;grid-template-columns:63px 5px minmax(0,1fr);align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.meta .meta-separator{display:none}.state-dot{width:5px;height:5px;border-radius:50%;background:#8b949e;display:inline-block}.running{background:#3fb950}.attention{background:#d29922}
.row-time{font-size:11px;color:var(--muted);white-space:nowrap;width:58px;text-align:right}
.star{color:#697481;border:0}.star[aria-pressed=true]{color:#e3b95f}.star[aria-pressed=true] svg{fill:#e3b95f22}
.row .icon{width:24px;min-height:24px}.row-resume{border:0;color:var(--muted)}
.list-foot{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:11px;padding:6px 12px;margin-top:auto;border-top:1px solid var(--border);min-height:28px}
.empty{padding:28px 12px;text-align:center}.empty h2{font-size:13px;font-weight:500}.empty button{margin-top:12px}
.detail{width:280px;background:var(--surface);border-left:1px solid var(--border);padding:12px;overflow:auto;flex-shrink:0}
.detail-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;color:var(--muted);font-size:11px}.detail-top .icon{border:0}
.detail h2{font-size:14px;line-height:1.4;margin:0 0 16px;font-weight:500}
.detail dl{font-size:11px;display:grid;grid-template-columns:77px minmax(0,1fr);gap:12px 8px;align-items:baseline}
.detail dt{color:var(--muted)}.detail dd{margin:0;overflow-wrap:anywhere;line-height:1.5}.detail dd button{padding:1px 6px;min-height:22px;font-size:11px}
.detail .primary{margin-top:16px}.primary{background:#58a6ff!important;border-color:#58a6ff;color:#081421;font-weight:500}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:20px;overflow:auto;flex:1;align-items:start}
.column{background:#11161d;border:1px solid #262e38;border-radius:9px;padding:14px;min-height:250px}.column h2{font-size:13px;margin:0 0 16px;display:flex;gap:8px;align-items:center}
.card{border:1px solid var(--border);border-radius:7px;background:var(--surface);padding:16px;margin-top:10px;line-height:1.5}.card strong{font-size:13px;display:block;margin:9px 0}.card p{font-size:11px}
.prototype-bar{height:25px;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:10px;color:var(--muted);gap:8px}
.prototype-bar b{font-weight:400}.prototype-bar button{border:0;color:var(--muted);font-size:10px;min-height:22px;padding:2px 4px}
 dialog{background:var(--surface);color:var(--text);border:1px solid #465364;border-radius:7px;padding:18px;width:360px;max-width:calc(100vw - 32px);box-shadow:0 12px 45px #0008}
dialog::backdrop{background:#02050b99}dialog h2{font-size:15px;margin:0 0 12px;font-weight:600}dialog p{font-size:11px;margin-bottom:16px}dialog label{display:block;margin-bottom:6px;font-size:11px}
dialog input,dialog select{width:100%;padding:7px;border:1px solid var(--border);background:var(--bg);border-radius:4px}dialog footer{display:flex;justify-content:flex-end;gap:6px;margin-top:18px}
.toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%);padding:8px 12px;background:var(--raised);border:1px solid #53647c;border-radius:5px;box-shadow:0 4px 16px #0006;font-size:11px;max-width:90vw;z-index:5}
.toast button{border:0;color:var(--accent);margin-left:10px;min-height:20px;padding:0}[hidden]{display:none!important}
@media(max-width:1100px){.row-text{grid-template-columns:minmax(0,1fr) 104px}.meta{grid-template-columns:5px minmax(0,1fr)}.meta .agent-name{display:none}.search{width:180px}.view-control>span{display:none}.detail{position:absolute;right:0;top:0;bottom:0;box-shadow:-8px 0 24px #0005;z-index:2}.tools{display:none}}
@media(max-width:760px){.sidebar{width:155px}.list-toolbar{flex-wrap:wrap;gap:7px;padding:8px 10px}.filters{margin-left:0;flex:1;flex-wrap:wrap}.search{flex:1;min-width:120px}.row-text{display:block}.meta{display:flex;gap:5px;font-size:10px;margin-top:3px}.meta .agent-name{display:inline}.meta .meta-separator{display:inline}.row{min-height:43px;padding:4px 10px;gap:6px}.row-time{width:48px;font-size:10px}.agent{display:none}.utility{display:none}.view-control>span{display:none}.header{gap:10px}.brand{font-size:14px}.brand svg{display:none}.row-resume{display:none}.group-head{padding-left:10px}.list-foot .hint{display:none}.batch{flex-wrap:wrap;gap:5px}.batch strong{margin-right:0}.board{grid-template-columns:1fr}.prototype-bar .extra{display:none}}
@media(max-width:620px){.list-toolbar h1{width:100%;max-width:none}.filters{width:100%;flex-wrap:nowrap}.filters select{max-width:92px;font-size:10px;padding:0 3px}.search{min-width:80px}.search input{font-size:11px}.row-time{display:none}.sidebar{width:145px}.header nav{gap:4px}.view-control select{max-width:78px}.list-foot{font-size:10px}}

.view-heading{display:flex;align-items:center;gap:7px;min-width:0}.view-heading .icon{border:0;color:var(--muted);width:24px;min-height:24px}
.project-tree-toggle{border:0;padding:0;display:flex;align-items:center;gap:5px;color:inherit;font-size:11px;min-height:22px}.project-tree-toggle svg{width:12px;height:12px;transform:rotate(90deg)}.project-tree-toggle[aria-expanded=false] svg{transform:rotate(0)}
.group-head{width:100%;text-align:left;border:0;border-radius:0;cursor:pointer}.group-head>svg:first-child{width:11px;transform:rotate(90deg)}.group-head[aria-expanded=false]>svg:first-child{transform:rotate(0)}
.title-line{display:flex;align-items:center;gap:7px;min-width:0}.title-line .state-dot{flex-shrink:0}.session-title{flex:0 1 auto;min-width:0}
.row-text{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;align-items:center}
.metrics,.metric-head{display:grid;grid-template-columns:76px 82px 106px;gap:8px;align-items:center;min-width:0;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.metrics>span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.worked{display:flex;align-items:center;gap:5px}.worked svg{width:12px;height:12px}.context-usage{display:flex;align-items:center;gap:6px}.context-track{width:28px;height:4px;background:var(--border);border-radius:2px;overflow:hidden;flex-shrink:0}.context-track i{display:block;height:100%;background:#6694c3}.top-model{font-size:10px}
.column-labels{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 59px;font-size:10px;color:var(--muted);border-bottom:1px solid #30363d55;flex-shrink:0}.column-labels>span:first-child{flex:1}.metric-head{width:280px;font-size:10px}.updated-head{width:58px;text-align:right}.actions-head{width:56px}
@media(max-width:1100px){.row-text{display:block}.row{min-height:49px}.metrics{margin-top:5px;grid-template-columns:76px 82px minmax(0,1fr);font-size:10px;gap:8px}.column-labels{display:none}}
@media(max-width:760px){.row-text{display:block}.row{min-height:49px}.row-main{min-width:0}.metrics{grid-template-columns:66px 67px minmax(0,1fr);gap:6px}.context-track{width:19px}.session-title{font-size:11px}.view-heading{max-width:100%}.title-line{gap:5px}}
@media(max-width:620px){.list-toolbar .view-heading{width:100%}.view-heading h1{width:auto}.row{gap:4px}.metrics{grid-template-columns:61px 60px minmax(0,1fr);gap:4px}.worked{gap:3px}.metrics .top-model{font-size:9px}}
.group-head.drag-over{outline:1px solid var(--accent);outline-offset:-1px;background:#58a6ff22}.group-empty{padding:10px 32px;font-size:11px;color:var(--muted)}#move-group-field{margin-top:12px}#new-group{white-space:nowrap;font-size:11px}

function renderDetail(){const s=sessions.find(s=>s.id===detailId);$('detail').hidden=!s;if(!s)return;const m=metrics(s);$('detail').innerHTML=`<div class="detail-top"><span>Session</span><button class="icon" id="close-detail" aria-label="Close preview">${icon('close')}</button></div><h2>${esc(s.title)}</h2><dl><dt>Agent</dt><dd>${s.source==='codex'?'Codex':'OpenCode'}</dd><dt>Project</dt><dd>${esc(projectOf(s)?.name||'Unassigned')} <button id="detail-move">Move…</button></dd><dt>Original folder</dt><dd>${esc(s.directory)}</dd><dt>Status</dt><dd>${status(s)}</dd><dt>Worked</dt><dd title="Observed running time, excluding idle time and subagents">${m.time}</dd><dt>Context</dt><dd>${m.context?`${m.context.percent}% · ${m.context.used.toLocaleString('en-US')} / ${m.context.limit.toLocaleString('en-US')} tokens`:"—"}</dd><dt>Top model</dt><dd>${esc(m.model)}${m.model!=='—'?`<br><span class="muted">${m.modelTime} observed</span>`:''}</dd>${projectOf(s)?`<dt>Group</dt><dd>${esc(groupOf(s)?.name||'Uncategorized')}</dd>`:''}</dl><button class="primary" id="detail-resume">${icon('terminal')} Resume session</button>`;$('close-detail').onclick=()=>{const old=detailId;detailId=null;renderDetail();document.querySelector(`[data-open="${CSS.escape(old)}"]`)?.focus()};$('detail-move').onclick=()=>openMove([s.id]);$('detail-resume').onclick=()=>notify('Preview only — this would resume the session in its original agent.')}
function updateMoveGroups(value='') {const project=$('move-target').value;$('move-group-field').hidden=!project;$('move-group').innerHTML='<option value="">Uncategorized</option>'+(state.groups[project]||[]).map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('');$('move-group').value=(state.groups[project]||[]).some(g=>g.id===value)?value:'';}
function openMove(ids){moveIds=ids;$('move-target').innerHTML='<option value="">No project</option>'+state.projects.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');const first=sessions.find(s=>s.id===ids[0]);$('move-target').value=projectOf(first)?.id||'';const sameGroup=ids.every(id=>state.assignments[id]===state.assignments[first.id]&&state.sessionGroups[id]===state.sessionGroups[first.id]);updateMoveGroups(sameGroup?groupOf(first)?.id:'');$('move-dialog').showModal()}
$('move-target').onchange=()=>updateMoveGroups();
function move(ids,target,group=null){const project=state.projects.find(p=>p.id===target);if(target&&!project)return;if(group&&!((state.groups[target]||[]).some(g=>g.id===group)))return;undoState={assignments:{...state.assignments},sessionGroups:{...state.sessionGroups}};ids.forEach(id=>{const previous=state.assignments[id];if(target)state.assignments[id]=target;else delete state.assignments[id];if(group!==null||previous!==target){if(group)state.sessionGroups[id]=group;else delete state.sessionGroups[id]}});if(group!==null)state.collapsed=state.collapsed.filter(id=>id!==`group:${target}:${group||'none'}`);selected.clear();save();render();notify(`${ids.length} session${ids.length===1?'':'s'} moved to ${project?project.name+(group!==null?' / '+((state.groups[target]||[]).find(g=>g.id===group)?.name||'Uncategorized'):''):'No project'}`,true)}
$('move-selected').onclick=()=>openMove([...selected]);$('clear-selection').onclick=()=>{selected.clear();render()};$('favorite-selected').onclick=()=>{state.favorites=[...new Set([...state.favorites,...selected])];save();selected.clear();render();notify('Added to favorites')};
$('move-form').onsubmit=e=>{e.preventDefault();move(moveIds,$('move-target').value,$('move-target').value?$('move-group').value:'');$('move-dialog').close()};
document.querySelectorAll('[data-create]').forEach(el=>el.onclick=()=>{$('project-name').value='';$('project-name').setCustomValidity('');$('project-dialog').showModal()});
$('project-name').oninput=()=>$('project-name').setCustomValidity('');
$('project-form').onsubmit=e=>{e.preventDefault();const name=$('project-name').value.trim();if(!name||state.projects.some(p=>p.name.toLowerCase()===name.toLowerCase())){$('project-name').setCustomValidity(name?'This project already exists.':'Enter a project name.');$('project-name').reportValidity();return}const id='project-'+Date.now();state.projects.push({id,name});save();$('project-dialog').close();navigate(id);notify('Project created — move sessions here from All sessions.')};
document.querySelectorAll('[data-close]').forEach(el=>el.onclick=()=>el.closest('dialog').close());
function showPage(page){$('projects-view').hidden=page!=='projects';$('kanban-view').hidden=page!=='kanban';['projects','kanban'].forEach(p=>{$(p+'-tab').classList.toggle('active',p===page);$(p+'-tab').setAttribute('aria-pressed',String(p===page))});if(page==='kanban')$('kanban-view').innerHTML=Object.entries(fixture.board.columns).map(([key,col])=>`<section class="column"><h2><span class="state-dot ${key}"></span>${esc(col.title)}<span class="count">${col.count}</span></h2>${col.cards.map(c=>`<article class="card"><span class="muted">${esc(c.directory_name)} · ${c.source==='codex'?'Codex':'OpenCode'}</span><strong>${esc(c.title)}</strong><p>${esc(c.stage)}</p><p style="margin-top:14px">${esc(c.model_ref)}</p></article>`).join('')}</section>`).join('')}
$('projects-tab').onclick=()=>showPage('projects');$('kanban-tab').onclick=()=>showPage('kanban');
document.querySelectorAll('[data-demo]').forEach(el=>el.onclick=()=>notify(`${el.dataset.demo} is outside this Projects preview.`));
$('search').oninput=()=>{selected.clear();render()};$('agent-filter').onchange=()=>{selected.clear();render()};$('grouping').onchange=render;
$('reset').onclick=()=>{state=defaultState();save();$('search').value='';$('agent-filter').value='';$('grouping').value='project';undoState=null;showPage('projects');navigate('all');notify('Demo reset')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.querySelector('dialog[open]')){detailId=null;selected.clear();render()}});
render();
</script>
</body>
</html>
